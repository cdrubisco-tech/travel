    .travel-stats-title {
        cursor: pointer;
        font-weight: bold;
        display: block;
    }

    /* 默认内容隐藏（折叠） */
    .travel-stats-content {
        display: none;
    }

    /* 折叠状态：窄宽度 */
    .travel-stats-box.collapsed {
        width: 120px !important;
        padding: 8px !important;
    }

    /* 展开状态：正常宽度 */
    .travel-stats-box.expanded {
        width: 200px !important;
    }

    </style>

    <script>
    function setStatsState(state) {
        var box = document.getElementById("travel-stats-box");
        var content = document.getElementById("travel-stats-content");
        var title = document.getElementById("travel-stats-title");

        if (!box || !content || !title) return;

        if (state === "expanded") {
            // 展开
            content.style.display = "block";
            box.classList.remove("collapsed");
            box.classList.add("expanded");
            title.innerHTML = "❤️ 晋城攻略";
        } else if (state === "collapsed") {
            // 折叠
            content.style.display = "none";
            box.classList.remove("expanded");
            box.classList.add("collapsed");
            title.innerHTML = "❤️ 晋城攻略";
        }
    }

    function toggleStats() {
        var content = document.getElementById("travel-stats-content");
        if (!content) return;

        // 根据当前显示状态，手动切换
        if (content.style.display === "none" || content.style.display === "") {
            setStatsState("expanded");
        } else {
            setStatsState("collapsed");
        }
    }

    // 页面加载时根据屏幕宽度设置“默认状态”
    window.addEventListener("load", function() {
        if (window.innerWidth <= 600) {
            // 手机端 → 默认折叠
            setStatsState("collapsed");
        } else {
            // 电脑端 → 默认展开
            setStatsState("expanded");
        }
    });
    </script>

    <script>
    
    function selectAll(checked) {
        var checkboxes = document.querySelectorAll('input[type="checkbox"]');
        for (var i = 0; i < checkboxes.length; i++) {
            if (checkboxes[i].id !== 'selectAll' && checkboxes[i].id !== 'toggleMarkers') {
                if (checkboxes[i].checked !== checked) {
                    checkboxes[i].checked = checked;
                    
                    // 强制触发两个事件确保刷新
                    checkboxes[i].dispatchEvent(new Event('change'));
                    checkboxes[i].dispatchEvent(new Event('click'));
                }
            }
        }
    }
    
    function toggleMarkers(checked) {
        // 控制地点标记
        var markers = document.querySelectorAll('.leaflet-marker-icon');
        for (var i = 0; i < markers.length; i++) {
            markers[i].style.display = checked ? 'block' : 'none';
        }
        
        
        // 控制标记标签
        var markerLabels = document.querySelectorAll('.leaflet-tooltip');
        for (var i = 0; i < markerLabels.length; i++) {
            markerLabels[i].style.display = checked ? 'block' : 'none';
        }
    }
    
    // 初始化时绑定事件
    document.addEventListener('DOMContentLoaded', function() {
        var selectAllCheckbox = document.getElementById('selectAll');
        if (selectAllCheckbox) {
            selectAllCheckbox.addEventListener('change', function() {
                selectAll(this.checked);
            });
        }
        
        var toggleMarkersCheckbox = document.getElementById('toggleMarkers');
        if (toggleMarkersCheckbox) {
            toggleMarkersCheckbox.addEventListener('change', function() {
                toggleMarkers(this.checked);
            });
        }
    });
    </script>

                if (searchInput.value.trim() !== '') {
                    clearBtn.style.display = 'flex';
                    searchWrapper.classList.add('has-input');
                } else {
                    clearBtn.style.display = 'none';
                    searchWrapper.classList.remove('has-input');
                }
            }
            
            // 清空搜索框
            clearBtn.addEventListener('click', function(e) {
                e.stopPropagation(); // 防止事件冒泡
                searchInput.value = '';
                searchInput.focus();
                resultsDiv.style.display = 'none';
                updateClearButton();
            });
            
            // 输入时监听
            searchInput.addEventListener('input', function(e) {
                updateClearButton();
                
                var searchTerm = e.target.value.trim().toLowerCase();
                
                if (searchTerm.length === 0) {
                    resultsDiv.style.display = 'none';
                    return;
                }
                
                // 过滤匹配项
                var matches = searchData.filter(function(loc) {
                    return loc.loc.toLowerCase().includes(searchTerm) || 
                           loc.pinyin.toLowerCase().includes(searchTerm) ||
                           loc.abbr.toLowerCase().includes(searchTerm);
                });
                
                if (matches.length > 0) {
                    resultsDiv.innerHTML = '';
                    
                    matches.forEach(function(match) {
                        var item = document.createElement('div');
                        item.className = 'search-result-item';
                        item.innerHTML = `
                            <div class="search-result-title">${match.loc}</div>
                        `;
                        
                        item.onclick = function() {
                            // 跳转到对应位置
                            map.setView([match.lat, match.lng], 12);
                            
                            // 延迟执行，确保地图移动完成
                            setTimeout(function() {
                                // 查找对应的标记
                                allMarkers.forEach(function(marker) {
                                    var latLng = marker.getLatLng();
                                    // 通过坐标匹配找到对应的标记
                                    if (Math.abs(latLng.lat - match.lat) < 0.001 && 
                                        Math.abs(latLng.lng - match.lng) < 0.001) {
                                        // 打开popup
                                        if (marker.getPopup()) {
                                            marker.openPopup();
                                        }
                                    }
                                });
                            }, 300);
                            
                            resultsDiv.style.display = 'none';
                            searchInput.value = match.loc;
                            updateClearButton();
                        };
                        
                        resultsDiv.appendChild(item);
                    });
                    resultsDiv.style.display = 'block';
                } else {
                    resultsDiv.innerHTML = '<div class="no-results">未找到匹配结果</div>';
                    resultsDiv.style.display = 'block';
                }
            });
            
            // 初始更新清除按钮状态
            updateClearButton();

                if (!searchWrapper.contains(e.target)) {

            // 键盘导航

                if (e.key === 'Enter') {
                    var firstResult = resultsDiv.querySelector('.search-result-item');

                    }
                } else if (e.key === 'Escape') {
                    if (searchInput.value.trim() !== '') {
                        searchInput.value = '';
                        updateClearButton();
                    } else {
                        resultsDiv.style.display = 'none';
                    }

                }
            });

    <script>
    // 高亮轨迹线函数
    function highlightPolyline(polyline) {
        // 重置所有轨迹线
        resetAllPolylines();
        
        // 高亮选中的轨迹线
        polyline.setStyle({
            weight: polyline.options.originalWeight * 2 || 9,
            opacity: 1.0,
            color: polyline.options.originalColor || polyline.options.color
        });
        
        // 添加到高亮类
        if (polyline._path) {
            polyline._path.classList.add('polyline-highlight');
        }
        
        // 存储当前高亮的轨迹线
        window.currentHighlightedPolyline = polyline;
    }

    // 重置所有轨迹线
    function resetAllPolylines() {
        // 遍历所有图层
        for (var layerId in map_f178c138efb991b3602bafbb87201bf3._layers) {
            var layer = map_f178c138efb991b3602bafbb87201bf3._layers[layerId];
            if (layer instanceof L.Polyline) {
                // 重置样式
                layer.setStyle({
                    weight: layer.options.originalWeight || 2,
                    opacity: 0.8,
                    color: layer.options.originalColor || layer.options.color
                });
                
                // 移除高亮类
                if (layer._path) {
                    layer._path.classList.remove('polyline-highlight');
                }
            }
        }
    }

    // 初始化
    document.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
            // 为所有轨迹线添加点击事件
            for (var layerId in map_f178c138efb991b3602bafbb87201bf3._layers) {
                var layer = map_f178c138efb991b3602bafbb87201bf3._layers[layerId];
                if (layer instanceof L.Polyline) {
                    // 保存原始样式到options
                    layer.options.originalWeight = layer.options.weight;
                    layer.options.originalColor = layer.options.color;
                    
                    // 添加点击事件
                    layer.on('click', function(e) {
                        highlightPolyline(this);
                        e.originalEvent.stopPropagation(); // 阻止事件冒泡
                    });
                    
                    // 添加鼠标悬停效果
                    layer.on('mouseover', function(e) {
                        if (window.currentHighlightedPolyline !== this) {
                            this.setStyle({
                                weight: this.options.weight + 1,
                                opacity: 0.9
                            });
                        }
                    });
                    
                    layer.on('mouseout', function(e) {
                        if (window.currentHighlightedPolyline !== this) {
                            this.setStyle({
                                weight: this.options.originalWeight,
                                opacity: 0.8
                            });
                        }
                    });
                }
            }
            
            // 点击地图其他地方时重置所有轨迹线
            map_f178c138efb991b3602bafbb87201bf3.on('click', function(e) {
                if (!e.originalEvent.target.closest('.leaflet-overlay-pane')) {
                    resetAllPolylines();
                    window.currentHighlightedPolyline = null;
                }
            });
        }, 1000);
    });
    </script>

    var currentLightboxIndex = 0;
    var totalLightboxMarkers = lightboxMarkers.length;
    var isLightboxOpen = false;

    // ===== 核心函数 =====

    // 通过marker名称打开灯箱
    function openLightboxForMarker(markerName) {
        // 查找该名称在lightboxMarkers中的索引
        var index = -1;
        for (var i = 0; i < lightboxMarkers.length; i++) {
            if (lightboxMarkers[i].name === markerName) {
                index = i;
                break;
            }
        }
        
        if (index === -1) {
            console.log('该标记点不在灯箱循环列表中:', markerName);
            return;
        }
        
        openLightboxAtIndex(index);
    }

    // 打开指定索引的灯箱
    function openLightboxAtIndex(index) {
        if (index < 0 || index >= totalLightboxMarkers) return;
        
        currentLightboxIndex = index;
        updateLightboxContent();
        
        // 显示灯箱
        document.getElementById('lightbox').style.display = 'flex';
        isLightboxOpen = true;
        document.body.style.overflow = 'hidden';
        
        // 添加键盘事件监听
        document.addEventListener('keydown', handleLightboxKeys, true);
    }

    // 更新灯箱内容
    function updateLightboxContent() {
        var marker = lightboxMarkers[currentLightboxIndex];
        
        document.getElementById('lightboxImg').src = marker.image_large;
        document.getElementById('lightboxTitle').textContent = marker.name;
        document.getElementById('lightboxDesc').textContent = marker.description;
        document.getElementById('lightboxCounter').textContent = 
            (currentLightboxIndex + 1) + '/' + totalLightboxMarkers;
    }

    // 导航函数
    function navPrev() {
        currentLightboxIndex = (currentLightboxIndex - 1 + totalLightboxMarkers) % totalLightboxMarkers;
        updateLightboxContent();
    }

    function navNext() {
        currentLightboxIndex = (currentLightboxIndex + 1) % totalLightboxMarkers;
        updateLightboxContent();
    }

    // 关闭灯箱
    function closeLightbox() {
        document.getElementById('lightbox').style.display = 'none';
        isLightboxOpen = false;
        document.body.style.overflow = '';
        document.removeEventListener('keydown', handleLightboxKeys, true);
    }

    // ===== 键盘事件处理 =====
    function handleLightboxKeys(e) {
        if (!isLightboxOpen) return;
        
        // 阻止事件传播
        e.preventDefault();
        e.stopPropagation();
        
        switch(e.key) {
            case 'Escape':
                closeLightbox();
                break;
            case 'ArrowLeft':
            case 'a':
            case 'A':
                navPrev();
                break;
            case 'ArrowRight':
            case 'd':
            case 'D':
                navNext();
                break;
        }
    }

    // ===== 初始化 =====
    console.log('灯箱系统已加载');
    console.log('参与循环的标记点:', lightboxMarkers.map(m => m.name));
    console.log('总数量:', totalLightboxMarkers);
